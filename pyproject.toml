[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "source-ledger"
version = "0.3.0"
description = "Evidence-first product price collection, provenance storage, and XLSX reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "XlsxWriter>=3.2,<4", "openpyxl>=3.1,<4", "pypdf>=5,<7"]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
crawl4ai = ["crawl4ai>=0.7,<1"]
mcp = ["mcp>=1.10,<2"]
test = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/kindsusu/SourceLedger"
Documentation = "https://github.com/kindsusu/SourceLedger#readme"
Issues = "https://github.com/kindsusu/SourceLedger/issues"

[project.scripts]
source-ledger = "su_crawler.cli:main"
su-crawler = "su_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["su_crawler*"]
