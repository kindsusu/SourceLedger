name: Verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.6.1)
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish verified distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve exact release commit
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || exit 1
          SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Require successful Tests run for the same commit
        id: gate
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const target = process.env.TARGET_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'tests.yml', head_sha: target,
              event: 'push', per_page: 100,
            });
            const matching = runs.filter(run => run.head_sha === target && run.head_branch === 'main' && run.event === 'push');
            matching.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
            const latest = matching[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              core.setFailed(`Latest main-branch push Tests run for ${target} is absent or not successful`);
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: latest.id, per_page: 100,
            });
            if (!jobs.some(job => job.name === 'All environments passed' && job.conclusion === 'success')) {
              core.setFailed(`Latest Tests run ${latest.id} has no successful all-environments gate`);
              return;
            }
            core.setOutput('run_id', String(latest.id));
            core.info(`Verified exact commit ${target} in latest Tests run ${latest.id}`);
      - name: Download distributions from the verified run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_RUN: ${{ steps.gate.outputs.run_id }}
        run: gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name python-distributions --dir dist
      - name: Match package version to tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['RELEASE_TAG'][1:]
          files = sorted(path.name for path in Path('dist').iterdir() if path.is_file())
          wheels = [name for name in files if name.startswith(f'source_ledger-{version}-') and name.endswith('.whl')]
          sdists = [name for name in files if name == f'source_ledger-{version}.tar.gz']
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f'Distribution files do not match tag {version}: {files}')
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
