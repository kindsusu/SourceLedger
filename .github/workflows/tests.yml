name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      SOURCELEDGER_HEADLESS: '1'
      SOURCELEDGER_TEST_ARTIFACTS: .tmp/test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install through the portable setup
        run: python scripts/setup.py --dev --mcp --browser
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        run: .venv/bin/python -m playwright install-deps chromium
      - name: Record runtime versions
        shell: bash
        run: |
          mkdir -p .tmp/test-artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then TEST_PYTHON=.venv/Scripts/python.exe; else TEST_PYTHON=.venv/bin/python; fi
          "$TEST_PYTHON" -c "import sys, platform; print(sys.version); print(platform.platform())" > .tmp/test-artifacts/runtime.txt
          "$TEST_PYTHON" -m pip freeze >> .tmp/test-artifacts/runtime.txt
          "$TEST_PYTHON" -m playwright --version >> .tmp/test-artifacts/runtime.txt
      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m pytest tests -q --junitxml=.tmp/test-artifacts/junit.xml
      - name: Run macOS and Linux tests
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pytest tests -q --junitxml=.tmp/test-artifacts/junit.xml
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: .tmp/test-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build and install distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .tmp/wheel-check
          .tmp/wheel-check/bin/python -m pip install -c requirements/constraints.txt dist/*.whl 'mcp>=1.10,<2'
          .tmp/wheel-check/bin/python -I scripts/smoke_install.py
          .tmp/wheel-check/bin/python -I scripts/smoke_assistant_install.py
          .tmp/wheel-check/bin/python -I scripts/smoke_web_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  ci-gate:
    name: All environments passed
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test environment and package check
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$PACKAGE_RESULT" = success
