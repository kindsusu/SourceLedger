name: Tests

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      SOURCELEDGER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install through the portable setup
        run: python scripts/setup.py --dev --mcp --browser
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        run: .venv/bin/python -m playwright install-deps chromium
      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m pytest tests -q
      - name: Run macOS and Linux tests
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pytest tests -q

  package:
    name: Build and install distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .tmp/wheel-check
          .tmp/wheel-check/bin/python -m pip install -c requirements/constraints.txt dist/*.whl 'mcp>=1.10,<2'
          .tmp/wheel-check/bin/python -I scripts/smoke_install.py
          .tmp/wheel-check/bin/python -I scripts/smoke_assistant_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
